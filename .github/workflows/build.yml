name: Build Earth Lore (JDK 25 / NeoForge 26.1.2)

on:
  push:
    branches: [ main, 'feat/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & Test
        working-directory: neoforge-26.1.2
        run: >
          ./gradlew build --no-daemon
          -Dhttp.proxyHost= -Dhttps.proxyHost=
          -Dhttp.proxyPort= -Dhttps.proxyPort=
          -Dorg.gradle.java.installations.paths=$JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: earth-lore-neoforge-26.1.2-jar
          path: neoforge-26.1.2/build/libs/*.jar
